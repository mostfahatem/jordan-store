# Nixpacks configuration for Railway / Render automated deployment
[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan migrate --force --seed && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"
